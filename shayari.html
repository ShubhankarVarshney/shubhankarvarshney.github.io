<!doctype html>
<html lang="hi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>शेर / Shayari</title>
  <meta name="description" content="Shubhankar Varshney — Shayari / Sher list">
  <style>
    :root{
      --bg:#ffffff; --fg:#111111; --muted:#666; --rule:#e5e7eb; --link:#1a0dab;
      --card:#fafafa; --btn:#f4f4f5; --btnb:#d1d5db;
      --max: 900px;
    }
    *{box-sizing:border-box}
    html,body{margin:0;background:var(--bg);color:var(--fg);
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,"Noto Sans Devanagari",sans-serif;line-height:1.7}
    a{color:var(--link);text-decoration:none} a:hover{text-decoration:underline}
    header{border-bottom:1px solid var(--rule);background:#fff;position:sticky;top:0;z-index:10}
    .wrap{max-width:var(--max);margin:0 auto;padding:16px}
    .brand a{font-weight:600;font-size:20px;color:var(--fg)}
    h1{font-size:28px;margin:18px 0 6px}
    .hi{font-family:"Noto Sans Devanagari",system-ui,sans-serif}
    .controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:10px 0 16px}
    .search{flex:1 1 320px;display:flex;align-items:center;gap:8px;border:1px solid var(--rule);border-radius:8px;padding:10px 12px;background:#fff}
    .search input{border:0;outline:0;background:transparent;width:100%}
    .tag{border:1px solid var(--rule);border-radius:8px;padding:10px 12px;background:#fff}
    .list{display:block;margin:0;padding:0}
    article.sher{list-style:none;border-bottom:1px solid var(--rule);padding:14px 0}
    article.sher:last-child{border-bottom:0}
    .couplet{margin:0;font-size:19px}
    .couplet br{content:""; display:block; margin-top:6px}
    .actions{display:flex;gap:8px;margin-top:10px}
    button.copy{appearance:none;border:1px solid var(--btnb);background:var(--btn);
      border-radius:8px;padding:6px 10px;cursor:pointer;font-size:14px}
    button.copy:active{transform:translateY(1px)}
    .more{display:flex;justify-content:center;margin:18px 0}
    #loadMore{appearance:none;border:1px solid var(--btnb);background:#fff;padding:10px 14px;border-radius:10px;cursor:pointer}
    #loadMore:disabled{opacity:.5;cursor:not-allowed}
    footer{border-top:1px solid var(--rule);margin-top:20px}
    @media (min-width:760px){ h1{font-size:32px} .couplet{font-size:20px} }
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <!-- Only homepage link via your name, per your preference -->
      <div class="brand"><a href="/index.html">Shubhankar Varshney</a></div>
    </div>
  </header>

  <main class="wrap">
    <h1 class="hi">शेर</h1>
    

    <div class="controls">
      <label class="search" aria-label="Search">
        <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" role="img">
          <path d="M21 21l-4.3-4.3m1.8-5.2a7 7 0 11-14 0 7 7 0 0114 0z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <input id="q" type="search" placeholder="मिसरा/शब्द/टैग खोजें…">
      </label>

      <select id="tag" class="tag" aria-label="Filter by tag">
        <option value="">सभी टैग</option>
        <!-- JS will auto-populate tags -->
      </select>
    </div>

    <!--
      HOW TO ADD A SHER:
      - Duplicate an <article class="sher"> block.
      - Put your two lines inside <p class="couplet hi"> …<br>… </p>
      - Optionally set data-tags as a comma-separated list (used for filtering).
      - NO author, NO date by design.
    -->
    <section id="list" class="list">

      <article id="s-1" class="sher" data-tags="विचार,ख़ामोशी">
        <p class="couplet hi">हमें वहम था कि बाग अपना है 
<br>तूफान के बाद पता चला कि सूखे पत्तों पर भी हक़ हवाओं का है</p>
        <div class="actions">
          <button class="copy" data-target="s-1">कॉपी</button>
        </div>
      </article>

      <article id="s-2" class="sher" data-tags="ख़्वाब,उम्मीद">
        <p class="couplet hi">मेरे तलब के तकाज़े पे थोड़ा गौर तो कर मैं तेरे पास आया हूं खुदा के होते हुए</p>
        <div class="actions">
          <button class="copy" data-target="s-2">कॉपी</button>
        </div>
      </article>

      <article id="s-3" class="sher" data-tags="धैर्य,समय">
        <p class="couplet hi">हानि लाभ जीवन मरण यश अपयश विधी हाथ</p>
        <div class="actions">
          <button class="copy" data-target="s-3">कॉपी</button>
        </div>
      </article>

      <!-- Add more shers above this line -->
    </section>

    <div class="more">
      <button id="loadMore">और दिखाएँ</button>
    </div>

    <footer class="wrap" style="padding:16px 0;">
      <p>© <span id="y"></span> Shayari</p>
    </footer>
  </main>

  <script>
    // Year
    document.getElementById('y').textContent = new Date().getFullYear();

    // Elements & helpers
    const list = document.getElementById('list');
    let items = Array.from(list.querySelectorAll('article.sher'));
    const norm = s => (s||'').toLowerCase().normalize('NFD').replace(/\p{Diacritic}/gu,'').trim();

    // Build tags dropdown
    const tagSel = document.getElementById('tag');
    const tagSet = new Set();
    items.forEach(a => (a.dataset.tags||'').split(',').map(t=>t.trim()).filter(Boolean).forEach(t=>tagSet.add(t)));
    Array.from(tagSet).sort((a,b)=>a.localeCompare(b,'hi')).forEach(t=>{
      const opt=document.createElement('option'); opt.value=t; opt.textContent=t; tagSel.appendChild(opt);
    });

    // Search + Tag filter
    const q = document.getElementById('q');
    function applyFilter(){
      const term = norm(q.value);
      const tag = tagSel.value;
      let shown = 0;
      items.forEach(a=>{
        const text = norm(a.querySelector('.couplet')?.textContent) + ' ' + norm(a.dataset.tags);
        const tagOK = !tag || (a.dataset.tags||'').split(',').map(s=>s.trim()).includes(tag);
        const show = text.includes(term) && tagOK;
        a.style.display = show ? '' : 'none';
        if(show) shown++;
      });
      // If user filters, make sure Load More doesn't hide matching results
      if(term || tag){ document.getElementById('loadMore').disabled = true; }
      else { document.getElementById('loadMore').disabled = (visibleCount() >= items.length); }
    }
    q.addEventListener('input', applyFilter);
    tagSel.addEventListener('change', applyFilter);

    // Client-side pagination (like Rekhta list pages feeling)
    const PAGE = 10; // how many to show initially / per click
    let shown = 0;
    function visibleCount(){
      return items.filter(a => a.style.display !== 'none').length;
    }
    function showNext(batch = PAGE){
      const term = norm(q.value);
      const tag = tagSel.value;
      let count = 0;
      for(let i=0;i<items.length;i++){
        const a = items[i];
        const hiddenByFilter = a.style.display === 'none' && (term || tag);
        if(hiddenByFilter) continue; // filtered out
        if(a.dataset._visible === '1') continue; // already shown during pagination
        a.dataset._visible = '1';
        a.style.removeProperty('display');
        count++;
        if(count >= batch) break;
      }
      // Disable when done
      const btn = document.getElementById('loadMore');
      const remaining = items.filter(a => a.dataset._visible !== '1').length;
      btn.disabled = remaining === 0;
    }
    // Initialize: hide all, then show first PAGE
    function initPaging(){
      items.forEach(a=>{ a.dataset._visible = '0'; a.style.display='none'; });
      showNext(PAGE);
    }
    document.getElementById('loadMore').addEventListener('click', ()=> showNext(PAGE));

    // Copy handler
    list.addEventListener('click', (e)=>{
      const btn = e.target.closest('button.copy');
      if(!btn) return;
      const id = btn.dataset.target;
      const el = document.getElementById(id);
      const text = (el.querySelector('.couplet')?.textContent || '').trim();
      navigator.clipboard.writeText(text).then(()=>{
        const old = btn.textContent; btn.textContent='कॉपी हो गया';
        setTimeout(()=>btn.textContent=old,1000);
      });
    });

    // On load
    initPaging();
    applyFilter();
  </script>
</body>
</html>
