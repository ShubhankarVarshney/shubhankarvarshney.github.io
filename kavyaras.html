<!doctype html>
<html lang="hi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>KavyaRas — काव्यरस</title>
  <meta name="description" content="Shubhankar Varshney — KavyaRas (poems)">
  <style>
    :root{
      --bg:#ffffff; --fg:#111111; --muted:#555555; --rule:#e5e7eb; --link:#1a0dab;
      --max: 860px;
    }
    *{box-sizing:border-box}
    html,body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,"Noto Sans Devanagari",sans-serif;line-height:1.6}
    a{color:var(--link);text-decoration:none}
    a:hover{text-decoration:underline}
    header{border-bottom:1px solid var(--rule);background:var(--bg);position:sticky;top:0;z-index:10}
    .wrap{max-width:var(--max);margin:0 auto;padding:16px}
    .brand a{font-weight:600;font-size:20px;color:var(--fg)}
    main h1{font-size:28px;margin:16px 0 6px}
    .hi{font-family:"Noto Sans Devanagari",system-ui,sans-serif}
    .controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:10px 0 14px}
    .search{flex:1 1 260px;display:flex;align-items:center;gap:8px;border:1px solid var(--rule);border-radius:8px;padding:8px 10px}
    .search input{border:0;outline:0;background:transparent;width:100%}
    .sort{border:1px solid var(--rule);border-radius:8px;padding:8px 10px;background:transparent}
    .posts{display:block;margin:0;padding:0}
    article{list-style:none;padding:14px 0;border-bottom:1px solid var(--rule)}
    article:last-child{border-bottom:0}
    article h2{font-size:19px;margin:0 0 4px}
    .meta{font-size:13px;color:var(--muted)}
    footer{border-top:1px solid var(--rule);margin-top:20px}
    @media (min-width:760px){ main h1{font-size:32px} }
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <!-- Only link back to homepage via your name, as requested -->
      <div class="brand"><a href="/index.html">Shubhankar Varshney</a></div>
    </div>
  </header>

  <main class="wrap">
    <h1 class="hi">काव्यरस</h1>
    <p class="hi" style="margin:0 0 6px;">शीर्षक पर क्लिक करके पूरी कविता पढ़ें।</p>

    <div class="controls">
      <label class="search" aria-label="Search poems">
        <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" role="img" focusable="false">
          <path d="M21 21l-4.3-4.3m1.8-5.2a7 7 0 11-14 0 7 7 0 0114 0z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <input id="q" type="search" placeholder="Search title or keywords… / शीर्षक/शब्द खोजें" aria-label="Search">
      </label>

      <select id="sort" class="sort" aria-label="Sort posts">
        <option value="date-desc">Newest first</option>
        <option value="date-asc">Oldest first</option>
      </select>
    </div>

    <!--
      HOW TO CHANGE A POEM'S DATE:
      1) Update data-date (ISO: YYYY-MM-DD) on the <article>
      2) Update the <time> text for display (any format you like)
      The list auto-sorts by data-date on load and when you change the sorter.
    -->
    <section id="post-list" class="posts">
      <!-- Example: update href to your poem page, title text, and data-date -->
      <article data-title="आज मैं इतना बेचैन क्यों हूं" data-tags="विरह याद बेचैनी" data-date="2024-03-05">
        <h2 class="hi"><a href="/poem1.html">आज मैं इतना बेचैन क्यों हूं</a></h2>
        <div class="meta">नज़्म • <time datetime="2017-03-05">2017</time></div>
      </article>

      <!-- Another example (create poem2.html when ready) -->
      <article data-title="हर चीज़ का अपना एक वक़्त होता है" data-tags="समय धैर्य" data-date="2024-07-10">
        <h2 class="hi"><a href="/poem2.html">हर चीज़ का अपना एक वक़्त होता है</a></h2>
        <div class="meta">नज़्म • <time datetime="2017-07-10">2017</time></div>
      </article>

      <article data-title="और मैं" data-tags="मैं" data-date="2025-07-10">
        <h2 class="hi"><a href="/poem3.html">और मैं</a></h2>
        <div class="meta">ग़ज़ल • <time datetime="2025-07-10">2025</time></div>
      </article>

      <article data-title="दीवाने कैसे होते हैं" data-tags="मैं" data-date="2025-07-10">
        <h2 class="hi"><a href="/poem3.html">और मैं</a></h2>
        <div class="meta">ग़ज़ल • <time datetime="2025-07-10">2025</time></div>
      </article>
      <!-- Add more <article> blocks above this line -->
    </section>

    <footer class="wrap" style="padding:16px 0;">
      <p>© <span id="y"></span> KavyaRas</p>
    </footer>
  </main>

  <script>
    // Year
    document.getElementById('y').textContent = new Date().getFullYear();

    // Normalize helper (works for Latin/Devanagari searches)
    const normalize = s => (s||'').toLowerCase().normalize('NFD').replace(/\p{Diacritic}/gu,'');

    // Elements
    const q = document.getElementById('q');
    const postList = document.getElementById('post-list');
    let posts = Array.from(postList.querySelectorAll('article'));

    // Search
    function applyFilter() {
      const term = normalize(q.value);
      posts.forEach(a => {
        const hay = normalize((a.dataset.title||'') + ' ' + (a.dataset.tags||''));
        a.style.display = hay.includes(term) ? '' : 'none';
      });
    }
    q.addEventListener('input', applyFilter);

    // Sorting (by data-date)
    const select = document.getElementById('sort');
    function sortPosts() {
      const val = select.value;
      const byDateAsc = (a,b) => new Date(a.dataset.date) - new Date(b.dataset.date);
      let arr = posts.slice();
      if (val === 'date-desc') arr.sort((a,b) => byDateAsc(b,a));
      else arr.sort(byDateAsc);
      arr.forEach(a => postList.appendChild(a));
    }
    select.addEventListener('change', () => { sortPosts(); applyFilter(); });

    // Initial sort (newest first) + filter
    sortPosts();
    applyFilter();
  </script>
</body>
</html>
