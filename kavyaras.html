    href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@300;400;500;600&family=Noto+Sans+Devanagari:wght@400;500;600&display=swap"

<body>
  <div class="site-wrapper">

    <!-- Top Navigation -->
    <header class="topnav">
      <div class="topnav__inner">

            <li><a href="hobbies.html">Hobbies</a></li>
            <li><a href="kavyaras.html" class="active">KavyaRas</a></li>
            <li><a href="shayari.html">Shayari</a></li>
          </ul>
        </nav>
        <button class="menu-toggle" id="menuToggle" aria-label="Toggle navigation">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round">
            <line x1="3" y1="6" x2="21" y2="6" />
            <line x1="3" y1="12" x2="21" y2="12" />
            <line x1="3" y1="18" x2="21" y2="18" />
          </svg>
        </button>
      </div>
      <div class="topnav__mobile" id="mobileMenu">
        <a href="index.html">Home</a>
        <a href="Shubhankar_Varshney_CV.pdf">CV</a>
        <a href="hobbies.html">Hobbies</a>
        <a href="kavyaras.html" class="active">KavyaRas</a>
        <a href="shayari.html">Shayari</a>
      </div>
    </header>

    <!-- Main -->
    <main class="main-content">
      <div class="page-title">
        <h1 class="hi">काव्यरस</h1>
        <div class="title-accent"></div>
      </div>

      <div class="content-area">

        <div class="controls fade-in">
          <label class="search-box" aria-label="Search poems">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <path d="M21 21l-4.3-4.3m1.8-5.2a7 7 0 11-14 0 7 7 0 0114 0z" />
            </svg>
            <input id="q" type="search" placeholder="Search title or keywords… / शीर्षक/शब्द खोजें" aria-label="Search">
          </label>

          <select id="sort" class="sort-select" aria-label="Sort posts">
            <option value="date-desc">Newest first</option>
            <option value="date-asc">Oldest first</option>
          </select>
        </div>

        <section id="post-list" class="fade-in-delayed">
          <a href="poem1.html" class="poem-card" data-title="आज मैं इतना बेचैन क्यों हूं" data-tags="विरह याद बेचैनी"
            data-date="2024-03-05">
            <h2 class="hi">आज मैं इतना बेचैन क्यों हूं</h2>
            <div class="meta">नज़्म • <time datetime="2017-03-05">2017</time></div>
          </a>

          <a href="poem2.html" class="poem-card" data-title="हर चीज़ का अपना एक वक़्त होता है" data-tags="समय धैर्य"
            data-date="2024-07-10">
            <h2 class="hi">हर चीज़ का अपना एक वक़्त होता है</h2>
            <div class="meta">नज़्म • <time datetime="2017-07-10">2017</time></div>
          </a>

          <a href="poem3.html" class="poem-card" data-title="और मैं" data-tags="मैं" data-date="2025-07-10">
            <h2 class="hi">और मैं</h2>
            <div class="meta">ग़ज़ल • <time datetime="2025-07-10">2025</time></div>
          </a>

          <a href="poem4.html" class="poem-card" data-title="दीवाने कैसे होते हैं" data-tags="मैं"
            data-date="2025-07-10">
            <h2 class="hi">दीवाने कैसे होते हैं</h2>
            <div class="meta">ग़ज़ल • <time datetime="2025-07-10">2025</time></div>
          </a>
        </section>

      </div>

      <footer class="site-footer">
        <p>© <span id="year"></span> KavyaRas — Shubhankar Varshney</p>
      </footer>
    </main>

  </div>

  <script>
    // Year
    document.getElementById('year').textContent = new Date().getFullYear();

    // Mobile menu
    const menuToggle = document.getElementById('menuToggle');
    const mobileMenu = document.getElementById('mobileMenu');
    menuToggle.addEventListener('click', () => {
      mobileMenu.classList.toggle('is-open');
    });

    // Normalize helper
    const normalize = s => (s || '').toLowerCase().normalize('NFD').replace(/\p{Diacritic}/gu, '');

    // Elements
    const q = document.getElementById('q');
    const postList = document.getElementById('post-list');
    let posts = Array.from(postList.querySelectorAll('.poem-card'));

    // Search
    function applyFilter() {
      const term = normalize(q.value);
      posts.forEach(a => {
        const hay = normalize((a.dataset.title || '') + ' ' + (a.dataset.tags || ''));
        a.style.display = hay.includes(term) ? '' : 'none';
      });
    }
    q.addEventListener('input', applyFilter);

    // Sorting
    const select = document.getElementById('sort');
    function sortPosts() {
      const val = select.value;
      const byDateAsc = (a, b) => new Date(a.dataset.date) - new Date(b.dataset.date);
      let arr = posts.slice();
      if (val === 'date-desc') arr.sort((a, b) => byDateAsc(b, a));
      else arr.sort(byDateAsc);
      arr.forEach(a => postList.appendChild(a));
    }
    select.addEventListener('change', () => { sortPosts(); applyFilter(); });

    // Initial
    sortPosts();
    applyFilter();
  </script>
</body>

</html>
